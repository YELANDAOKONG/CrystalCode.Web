<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900">
  <style>
    :root {
      --paper: #eee9d9; --light: #faf7ed; --water: #d8dacc;
      --wash: #7f9188; --ridge: #43574e; --rock: #1f312a;
      --brush: #233b32; --mist: #f5f2e6; --seal: #aa4e3c;
      --moon: #d5b492;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #1b2928; --light: #293b38; --water: #1c2b2c;
        --wash: #718c84; --ridge: #536d64; --rock: #121e1c;
        --brush: #9aafa5; --mist: #48615b; --seal: #d4866d;
        --moon: #c1b794;
      }
    }
  </style>
  <defs>
    <linearGradient id="paper" x2=".15" y2="1">
      <stop style="stop-color:var(--paper)"/>
      <stop offset=".52" style="stop-color:var(--light)"/>
      <stop offset="1" style="stop-color:var(--water)"/>
    </linearGradient>
    <radialGradient id="sky" cx=".53" cy=".25" r=".64">
      <stop style="stop-color:var(--light)"/>
      <stop offset="1" style="stop-color:var(--light);stop-opacity:0"/>
    </radialGradient>
    <linearGradient id="distant" x2="0" y2="1">
      <stop style="stop-color:var(--wash);stop-opacity:.7"/>
      <stop offset=".73" style="stop-color:var(--wash);stop-opacity:.18"/>
      <stop offset="1" style="stop-color:var(--wash);stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="ravine" x1=".86" y1="0" x2=".12" y2="1">
      <stop style="stop-color:var(--ridge)"/>
      <stop offset=".48" style="stop-color:var(--ridge);stop-opacity:.67"/>
      <stop offset="1" style="stop-color:var(--wash);stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="rock" x1=".95" y1=".3" x2=".05" y2="1">
      <stop style="stop-color:var(--rock)"/>
      <stop offset=".6" style="stop-color:var(--ridge)"/>
      <stop offset="1" style="stop-color:var(--wash);stop-opacity:.12"/>
    </linearGradient>
    <linearGradient id="mist" x2="0" y2="1">
      <stop style="stop-color:var(--mist);stop-opacity:0"/>
      <stop offset=".45" style="stop-color:var(--mist);stop-opacity:.84"/>
      <stop offset="1" style="stop-color:var(--mist);stop-opacity:0"/>
    </linearGradient>
    <radialGradient id="moon">
      <stop offset=".84" style="stop-color:var(--moon);stop-opacity:.9"/>
      <stop offset="1" style="stop-color:var(--moon);stop-opacity:.15"/>
    </radialGradient>
    <filter id="fiber" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".72 .49" numOctaves="3" seed="14" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="bleed" x="-5%" y="-8%" width="110%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency=".023 .043" numOctaves="3" seed="17" result="grain"/>
      <feDisplacementMap in="SourceGraphic" in2="grain" scale="8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="soften" x="-10%" y="-25%" width="120%" height="150%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
    <g id="needles" fill="none" stroke="currentColor" stroke-linecap="round">
      <path stroke-width="1.25" d="M-24 3Q-5-5 21-4M-22 2Q-7-7 15-8M-18 3Q-1-5 23-1M-17 4Q1-1 24 2M-18 0Q-7-11 10-12M-16 1Q-7-12 4-14M-17 3Q-4-3 18-5M-19 4Q-4 1 16 2M-12 0Q3-6 21-6M-8 1Q8-2 25 0"/>
      <path opacity=".55" stroke-width=".75" d="M-25 2Q-12-6 1-8M-20 0Q-14-8-1-12M-16 3Q-2 4 12 5M-9 2Q8-7 19-7M-15 2Q0-1 25 1M-20 4Q-6 2 16 4"/>
    </g>
    <g id="bird" fill="none" stroke="currentColor" stroke-linecap="round">
      <path d="M-9-2Q-4-3 0 1Q5-4 10-3"/>
      <path opacity=".55" d="M0 1l1 2"/>
    </g>
  </defs>

  <!-- The empty water and pale sky form one field around the conversation. -->
  <rect width="1440" height="900" fill="url(#paper)"/>
  <rect width="1440" height="900" fill="url(#sky)"/>
  <circle cx="1044" cy="184" r="33" fill="url(#moon)" opacity=".63"/>

  <g fill="url(#distant)" filter="url(#bleed)">
    <path opacity=".57" d="M-40 478Q8 468 42 444l24-30 20 9 28-24 18 11 24-15 39 29 37-13 36 22 27-2 49 35 53 5 27-18 29 14 24-10 30 20 66 15 79 47 28 43-710 41Z"/>
    <path opacity=".65" d="M737 531q42-21 76-26l31-24 26 8 35-18 22 2 61-48 19 3 40-40 29 14 34-25 28 28 28-11 26 31 40 5 41 33 52 15 52-4 66 50 56 38 43 64-748-1Z"/>
    <path d="M-26 459l46-23 19-30 21-12 18-38 26-19 11-22 20-4 13 12 14-3 19 26 18 10 14 34 23 13 10 14 29 4 39 40 33-8 32 24 37 8 45 35 16 3 54 45-572 58Z"/>
    <path opacity=".87" d="M928 563l39-48 57-21 31-41 25-17 28-59 23-13 13-42 13-7 13-25 14-3 19 19 18 6 15 29 26 11 22 39 31 9 42 46 32 16 20 37 81 40v151l-553-91Z"/>
  </g>
  <g filter="url(#bleed)">
    <path fill="url(#ravine)" opacity=".68" d="M-40 532l52-21 45-55 21-8 24-42 15-11 24 3 30 42 22 7 21 33 39 24 19 25 34 13 32 33 21 1 49 28 51 31-499 68Z"/>
    <path fill="url(#ravine)" d="M1449 423l-38-32-28-13-14-28-24-18-22-61-18-16-14-39-16-17-10 4-13-20-9 1-15 22-17 10-11 31-22 20-10 40-15 15-9 40-31 29-18 43-34 20-16 32-33 16-28 34-54 35-95 35 100 46 475 12Z"/>
    <path fill="url(#rock)" opacity=".54" d="M1241 187l-17 42-7 44-24 39-11 43-26 29-23 46-55 65-43 22-21 32 47-18 43-35 28-14 47-73 31-67 26-41 4-51 16-23Z"/>
    <path fill="url(#rock)" opacity=".35" d="M1265 215l23 23 17 33 4 48 36 44 8 38 39 28 32 60 48 49 12 118-135-62-29-60-40-59-12-58-25-50 3-81Z"/>
    <path fill="url(#rock)" opacity=".57" d="M137 403l-10 34-27 32-7 26-38 49-79 32v52l103-62 29-37 13-39 24-26 8-31Z"/>
  </g>

  <!-- Scored brush lines follow the direction of the rock faces. -->
  <g fill="none" stroke="var(--brush)" stroke-linecap="round" filter="url(#bleed)">
    <path opacity=".34" stroke-width="2.1" d="M1241 202q-17 32-21 62t-28 62q-7 21-15 32m61-143q-2 27-13 59m24-40q-13 27-15 58t-19 53m-28-16q-10 38-36 65l-18 34m43-62-15 34-26 24m6-13-22 24-14 30m-3 0-27 21-20 29m207-286q15 21 18 56t25 57m-15-64 13 39 19 21m-23-22 10 24 17 17m42 43 14 34 28 30m-80-67 19 32 24 22m-78-38 14 51 25 34m38-9 19 39 19 16M130 410q-8 27-26 46l-12 28m40-52-10 29-19 23m54-49 11 21 19 13m-21-5 14 20 26 17m-92-11-17 32-26 17"/>
    <path opacity=".28" stroke-width="1.1" stroke-dasharray="9 4 2 3 14 3" d="M1216 293q-10 31-32 54m13-40-12 24-7 15m-19 55q-13 29-41 51m14-39q-16 31-40 52m4 9-50 33m164-180-9 32-17 22m84-113 5 33 16 34m-11-71 7 32 15 22m4 52 12 28 20 16m-1-6 20 33 19 15m-27-7 25 40 27 20m-104-51 8 39 18 27M124 450l-20 22-7 23m-23 24-25 29-19 11m141-89 18 25 38 19m-201-55 30-41m65-84-12 37-23 26m74-50 16 24 17 8 10 23"/>
    <path opacity=".24" stroke-width="5" stroke-dasharray="1 7 4 10 2 8" d="M1164 429q-42 44-89 68m108-109 25-55m56-66 16 55m38 47 32 37m18 69 59 49M30 518q35-24 57-65m64 9 26 28m50 42 53 30"/>
  </g>

  <!-- Broken washes let the foothills dissolve into the river. -->
  <g fill="url(#mist)" filter="url(#soften)">
    <path d="M-70 502q161-13 273 25t299 20q-116 38-254 22T-70 585Z" opacity=".66"/>
    <path d="M854 542q117-34 227-27t225-27q86-25 176-11v46q-128 12-173 35t-173 31q-145-11-282 18Z" opacity=".72"/>
    <path d="M-25 582q154-21 301 24t330 22q144-20 292-56 91-18 165 2-81 17-189 56-143 45-359 48-162 4-317-28T-25 672Z" opacity=".84"/>
  </g>
  <g fill="none" stroke="var(--brush)" stroke-linecap="round">
    <path opacity=".16" stroke-width="1.45" d="M18 724q86-17 201-5t170 5m-184 22q130-5 226 2m-98 50q117-9 206-7m-86-21 132-2m-53 49q89-5 189-2m71-114q111-11 235-2m-110 59q76-7 168-2m-22 23q93-10 211-4m-61 26q90-9 186-2m-130 33q81-9 154-6"/>
    <path opacity=".11" stroke-width="3" d="M-20 749q77-11 169-7m-23 9 83-3m614-51 96-4m125 49 79-2m60 44 106-2m-675 69 160-3m203-40 108-2m109-94 93-1"/>
  </g>

  <g color="var(--brush)" opacity=".53">
    <use href="#bird" transform="translate(1098 357) rotate(-9) scale(.8)"/>
    <use href="#bird" transform="translate(1120 349) rotate(7) scale(.62)"/>
    <use href="#bird" transform="translate(1136 361) rotate(10) scale(.48)"/>
  </g>

  <g transform="translate(1024 734)" fill="var(--brush)">
    <path opacity=".78" d="M-34 3Q-5 8 28 1l8-4-6 10Q5 16-24 10Z"/>
    <path opacity=".6" d="M-14 5Q-8-7 5-8q8 2 13 11Z"/>
    <path d="M-18 2l2-9 4 1 1 8m-10-9 7-7 7 6Z" opacity=".83"/>
    <path d="M-18-4l-20 19" fill="none" stroke="var(--brush)" stroke-width="1.2" opacity=".67"/>
    <path d="M-43 16q22 2 39 0m-62 4q19 1 29 0m19-7 26 1" fill="none" stroke="var(--brush)" stroke-width="1" opacity=".27"/>
  </g>

  <!-- Short, dark marks at the edges anchor the long pale washes. -->
  <g filter="url(#bleed)">
    <path fill="url(#rock)" opacity=".82" d="M-37 900V708l48-18 41 6 43-16 31 12 19 18 33 6 15 25 28 9 18 22 35 11 34 27-14 23 66 15 42 52Z"/>
    <path fill="url(#rock)" opacity=".9" d="m1439 638-45 1-33 21-51 17-20 32-37 12-20 32-27 10-19 29-52 17 22 12-39 19 46 16-17 44h305Z"/>
    <path fill="url(#rock)" d="M-4 744l38-31 27 6 26-7 35 17 5 20 36 11 9 26 55 31 7 22 57 26 35 35H-4Z" opacity=".67"/>
    <path fill="url(#rock)" d="m1453 687-59 15-22 25-46 22-10 25-67 25 17 19-46 21 21 15-26 46h238Z" opacity=".78"/>
    <g fill="none" stroke="var(--brush)" stroke-linecap="round">
      <path opacity=".34" stroke-width="2.4" d="m-8 736 51-21 30 3 32-16 18 9m-104 49 37-15 33 1 20-14 10 21m23-5 13 18 15 5 17 25m-117 5 36-26 26 2m-22 11 17 12 23 2 34 29m-160 4 32-23 25-2m113 39 39 14 20 19m1016-171-37 20-11 29-32 11m-8 24 59-20 17-33 42-21m14 1-16 24-52 25-7 21m-61 10 57-18 10-20m-16 50 22-21 47-9 23-26m-136 75 51-18 65-4 28-20"/>
      <path opacity=".36" stroke-width="3" stroke-dasharray="1 4 6 5" d="m-13 713 57-14 34-1 27-13 25 17m-52 57-34 13-35 22m144-27 26 13 17 17m-70 25 49 19 44 22m1165-171-44 26-20 24-58 21m12 21 64-23 56-25m-131 111 71-14 67-33"/>
    </g>
  </g>

  <!-- Pine branches are tapered silhouettes, with clusters of dry needles. -->
  <g color="var(--brush)" fill="currentColor">
    <g opacity=".88" transform="translate(-35 3)">
      <path d="M1358 748q-24-54-30-97-8-55-35-78l-17-15 23 11q28 20 37 75 10 51 33 94Z"/>
      <path d="M1335 670q-22-35-49-53l-34-12-30-2 26-3 39 11q30 17 44 38m-9-23q-11-28-34-46l-35-10 28 3 26 15m30 96q16-36 36-50l34-11-21 9q-23 10-41 62m-16-75q7-30 27-44l23-6-18 9q-18 14-26 50m-36-5-35-3-28 9 22-12 33 1m71 40 35-9 23 4-23-1-40 17m-71-83-19-19-23-7 23 3 28 20"/>
      <use href="#needles" transform="translate(1214 603) rotate(3) scale(1.05)"/>
      <use href="#needles" transform="translate(1245 595) rotate(8) scale(.9)"/>
      <use href="#needles" transform="translate(1268 607) rotate(12) scale(.8)"/>
      <use href="#needles" transform="translate(1228 629) rotate(-10) scale(.82)"/>
      <use href="#needles" transform="translate(1250 622) rotate(-9) scale(.7)"/>
      <use href="#needles" transform="translate(1253 565) rotate(3) scale(.78)"/>
      <use href="#needles" transform="translate(1274 553) rotate(20) scale(.6)"/>
      <use href="#needles" transform="translate(1299 576) rotate(27) scale(.7)"/>
      <use href="#needles" transform="translate(1380 571) rotate(-8) scale(.8)"/>
      <use href="#needles" transform="translate(1362 580) rotate(-15) scale(.66)"/>
      <use href="#needles" transform="translate(1409 621) rotate(-9) scale(.9)"/>
      <use href="#needles" transform="translate(1387 627) rotate(-12) scale(.67)"/>
      <use href="#needles" transform="translate(1425 652) rotate(4) scale(.95)"/>
      <use href="#needles" transform="translate(1401 650) rotate(-6) scale(.66)"/>
    </g>
    <g transform="translate(744 309) scale(-.52 .58)" opacity=".65">
      <path d="M1350 750q0-75-21-113-14-31-54-52l24 7q48 29 63 148Zm-4-59q21-40 57-52l-24 3q-21 4-38 36m-9-32q-17-17-48-22l-35 5 43-1 46 28"/>
      <use href="#needles" transform="translate(1275 585) scale(1.1)"/>
      <use href="#needles" transform="translate(1303 592) rotate(17) scale(.8)"/>
      <use href="#needles" transform="translate(1258 628) rotate(-7) scale(.94)"/>
      <use href="#needles" transform="translate(1282 620) scale(1)"/>
      <use href="#needles" transform="translate(1409 637) rotate(-10)"/>
      <use href="#needles" transform="translate(1384 642) rotate(-12) scale(.68)"/>
    </g>
  </g>

  <g transform="translate(1106 289) rotate(-3)" fill="none" stroke="var(--seal)" stroke-linecap="square" opacity=".78">
    <path stroke-width="1.3" d="M0 1l16-1 1 19-16 1ZM3 6l4-2 2 4 4-3 1 7M4 14l4-3 2 3 3-2M4 17l9-1"/>
  </g>
  <rect width="1440" height="900" filter="url(#fiber)" opacity=".24" style="mix-blend-mode:soft-light"/>
</svg>
